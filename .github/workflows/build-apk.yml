name: Build APK

# Builds the Moonlight APKs on GitHub's free hosted Linux runners and uploads them
# as downloadable artifacts. Runs on push, PR, and on-demand (Actions tab -> Run
# workflow). Everything this build needs is public (Maven Central / Google /
# gradlePluginPortal for the Meta Spatial SDK), so no secrets or credentials are
# required.
#
# Download built APKs from: the workflow run page -> "Artifacts" section.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # if the quest flavor fails, still publish the mobile APK
      matrix:
        # Gradle assemble tasks. Variant name is <root><Device><BuildType>.
        include:
          - name: mobile-debug
            task: assembleNonRootMobileDebug
            apk_glob: app/build/outputs/apk/nonRootMobile/debug/*.apk
          - name: quest-debug
            task: assembleNonRootQuestDebug
            apk_glob: app/build/outputs/apk/nonRootQuest/debug/*.apk

    name: ${{ matrix.name }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls moonlight-common-c (required for the native build)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platform + build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-${{ matrix.name }}
          path: ${{ matrix.apk_glob }}
          if-no-files-found: error
          retention-days: 14
