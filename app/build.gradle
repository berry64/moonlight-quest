apply plugin: 'com.android.application'
// Kotlin is only required to compile the Quest VR sources (src/quest/**/*.kt).
// It applies project-wide, but the default 'mobile' flavor contains no Kotlin
// sources, so its output is unchanged aside from the Kotlin stdlib.
apply plugin: 'org.jetbrains.kotlin.android'
// The Meta Spatial SDK Gradle plugin. Only meaningful for the 'quest' flavor.
// NOTE (version reconciliation): the Spatial SDK samples build with AGP 8.11+/
// Gradle 9.4/Kotlin 2.1/JDK 17. This project is on AGP 8.5.1/Gradle 8.7. Building
// the 'quest' flavor may require bumping AGP/Gradle/Kotlin to versions compatible
// with the Spatial SDK release you pull. The 'mobile' flavor builds without it.
apply plugin: 'com.meta.spatial.plugin'

android {
    ndkVersion "27.0.12077973"

    compileSdk 34

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionName "12.1"
        versionCode = 314

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    // Order matters: variant names read as <root><device><buildType>,
    // e.g. nonRootMobileDebug, nonRootQuestDebug.
    flavorDimensions.add("root")
    flavorDimensions.add("device")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.limelight.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.limelight"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }

        // The 'mobile' flavor is the original app, unchanged. It's the default so
        // existing build commands (and the IDE) keep producing the normal app.
        mobile {
            dimension "device"
            isDefault true
            buildConfigField "boolean", "VR_BUILD", "false"
        }

        // The 'quest' flavor adds the Meta Spatial SDK immersive streaming view.
        // Quest runs Android 10+ (Horizon OS), so raise minSdk here. This flavor's
        // applicationId suffix keeps it installable alongside the phone build.
        quest {
            dimension "device"
            minSdk 29
            applicationIdSuffix ".quest"
            versionNameSuffix "-quest"
            buildConfigField "boolean", "VR_BUILD", "true"
        }
    }

    // 'root' is capped at API 25 (maxSdk 25) while 'quest' requires API 29+, so the
    // rootQuest* combination is impossible. Drop those variants entirely.
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains("root") && names.contains("quest")) {
            setIgnore(true)
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Match the Java bytecode target for the Kotlin sources used by the quest flavor.
    kotlinOptions {
        jvmTarget = "11"
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Moonlight (Debug)"
            resValue "string", "app_label_root", "Moonlight (Root Debug)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix ".unofficial"
            resValue "string", "app_label", "Moonlight"
            resValue "string", "app_label_root", "Moonlight (Root)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.5.9'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    // ---- Meta Quest VR (quest flavor only) ----
    // Scoped to 'questImplementation' so the default 'mobile' build pulls none of
    // these and stays byte-for-byte identical to the original app.
    // Versions are centralized in the root build.gradle (ext.spatialSdkVersion /
    // ext.kotlinVersion) so the plugin and these libraries never drift apart.
    // See docs/VR_ARCHITECTURE.md for the AGP/Gradle/Kotlin compatibility notes.
    def spatialSdkVersion = rootProject.ext.spatialSdkVersion
    questImplementation "com.meta.spatial:meta-spatial-sdk:${spatialSdkVersion}"
    questImplementation "com.meta.spatial:meta-spatial-sdk-vr:${spatialSdkVersion}"
    questImplementation "com.meta.spatial:meta-spatial-sdk-toolkit:${spatialSdkVersion}"
    // Kotlin standard library for the VR sources.
    questImplementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
}
